 document.querySelectorAll(".slot.hot").forEach(s=>s.classList.remove("hot"));
 if(h&&e.type==="pointerup")place(+h.dataset.i);else{tl.classList.add("rel");reset()}}
tl.addEventListener("pointerup",up);tl.addEventListener("pointercancel",up);
function burst(r,n){
 const cx=r.left+r.width/2,cy=r.top+r.height/2,cols=["#c8ff00","#d9ff3f","#111111","#7a7a76","#b7e600"];
 try{navigator.vibrate&&navigator.vibrate(40)}catch(_){}
 const ring=document.createElement("div");ring.className="fx";ring.style.cssText+="width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid #c8ff00;left:"+cx+"px;top:"+cy+"px";
 document.body.appendChild(ring);
 ring.animate([{transform:"scale(.3)",opacity:1},{transform:"scale(7)",opacity:0}],{duration:700,easing:"ease-out"}).onfinish=()=>ring.remove();
 for(let k=0;k<n;k++){const p=document.createElement("div");p.className="fx";const s=6+Math.random()*8;
  p.style.cssText+="width:"+s+"px;height:"+s*(Math.random()<.5?1:.5)+"px;background:"+cols[k%5]+";left:"+cx+"px;top:"+cy+"px";
  const a=Math.random()*6.283,d=90+Math.random()*190;
  document.body.appendChild(p);
  p.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:"translate("+Math.cos(a)*d+"px,"+(Math.sin(a)*d+60)+"px) rotate("+(Math.random()*720-360)+"deg)",opacity:0}],{duration:800+Math.random()*600,easing:"cubic-bezier(.1,.8,.3,1)"}).onfinish=()=>p.remove()}}

 msg("Joker : la carte va dans l’un des deux emplacements en vert.")};
